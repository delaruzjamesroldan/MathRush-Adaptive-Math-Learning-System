<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathRush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIGN IN -->
<section id="signin-screen" class="screen">
    <div class="card">
        <h1>MATHRUSH</h1>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="signIn()">Sign In</button>
        <p class="link" onclick="showScreen('signup-screen')">Sign Up</p>
    </div>
</section>

<!-- SIGN UP -->
<section id="signup-screen" class="screen hidden">
    <div class="card">
        <h2>Create Account</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="goToTerms()">Next</button>
    </div>
</section>

<!-- TERMS -->
<section id="terms-screen" class="screen hidden">
    <div class="card">
        <h3>Terms & Conditions</h3>
        <input type="checkbox" id="agree"> I agree
        <button onclick="acceptTerms()">Continue</button>
    </div>
</section>

<!-- DASHBOARD -->
<section id="dashboard-screen" class="screen hidden">
    <div class="card">
        <h2>Dashboard</h2>
        <p>Difficulty: <span id="difficulty">easy</span></p>
        <button onclick="startGame()">Start Game</button>
        <button onclick="showScreen('profile-screen')">Profile</button>
    </div>
</section>

<!-- GAME -->
<section id="game-screen" class="screen hidden">
    <div class="card">
        <h2 id="question">Question</h2>
        <input type="number" id="answer" placeholder="Your answer">
        <button onclick="submitAnswer()">Submit</button>
    </div>
</section>

<!-- PROFILE -->
<section id="profile-screen" class="screen hidden">
    <div class="card">
        <h2>Profile</h2>
        <p id="user-name">User</p>
        <button onclick="showScreen('dashboard-screen')">Back</button>
    </div>
</section>

<!-- RESULT -->
<section id="result-screen" class="screen hidden">
    <div class="card">
        <h2>Great Job!</h2>
        <p>Game Finished</p>
        <button onclick="showScreen('dashboard-screen')">Back Home</button>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
